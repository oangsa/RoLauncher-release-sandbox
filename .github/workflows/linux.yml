name: Linux development port

on:
  push:
    branches: [main, dev, 'feature/**', 'codex/**', 'hotfix/**']
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-checks:
    name: Linux checks (${{ matrix.distro }})
    if: >-
      false &&
      github.repository == 'oangsa/RoLauncher-release-sandbox' &&
      github.repository_id == '1423257712'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: Ubuntu
            container: ubuntu:24.04
          - distro: Arch
            container: archlinux:base-devel
    container: ${{ matrix.container }}
    steps:
      - name: Install offline test runtime
        shell: bash
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y git openssh-client python3
          else
            pacman -Syu --noconfirm --needed git openssh python
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Offline authority, signature and fixture regressions
        run: python3 scripts/offline_tests.py
