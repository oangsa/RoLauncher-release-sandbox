name: Beta release

on:
  push:
    tags: ['beta-v*']

permissions:
  contents: read

concurrency:
  group: beta-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-checks:
    name: Windows checks
    if: >-
      false &&
      github.repository == 'oangsa/RoLauncher-release-sandbox' &&
      github.repository_id == '1423257712'
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Offline authority, signature and fixture regressions
        run: python scripts/offline_tests.py
      - name: Package inert windows fixtures from exact source
        run: python scripts/sandbox_fixtures.py windows --output dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'push'
        with:
          name: beta-windows-attempt-${{ github.run_attempt }}
          path: |
            dist/rolauncher-v*-setup-x64.exe
            dist/rolauncher-v*-windows-x64.zip
            dist/rolauncher-v*-source.zip
            dist/rolauncher-v*-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  linux-checks:
    name: Linux checks and package (Ubuntu 24.04)
    if: >-
      false &&
      github.repository == 'oangsa/RoLauncher-release-sandbox' &&
      github.repository_id == '1423257712'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Offline authority, signature and fixture regressions
        run: python scripts/offline_tests.py
      - name: Package inert linux fixtures from exact source
        run: python scripts/sandbox_fixtures.py linux --output dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'push'
        with:
          name: beta-linux-attempt-${{ github.run_attempt }}
          path: |
            dist/rolauncher-v*-linux-x64.tar.gz
            dist/rolauncher-v*-linux-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
